name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -count=1 ./...
      - name: docs up to date
        run: |
          go run . --gen-docs docs
          git diff --exit-code docs || (echo "docs/ is out of date: run 'go run . --gen-docs docs'"; exit 1)
