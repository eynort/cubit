name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test
        run: go test -count=1 ./...
      - name: build
        run: |
          mkdir -p dist
          build() { # os arch [suffix]
            out="dist/minecraft-bot-${GITHUB_REF_NAME}-$1-$2$3"
            CGO_ENABLED=0 GOOS=$1 GOARCH=$2 go build -trimpath -ldflags "-s -w" -o "$out" .
          }
          build linux amd64
          build linux arm64
          build windows amd64 .exe
          build darwin amd64
          build darwin arm64
          build android arm64   # Termux
          cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
