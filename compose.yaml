# Todo de una vez: el servidor de pruebas (Minecraft vanilla) y el hub con los bots.
#
#   ./up.sh                    # lo levanta todo y te da la URL del panel
#   docker compose up -d       # (lo mismo)
#
# Los bots se crean y se configuran en el panel (bot-data/bots/<id>/); en
# .env (ver .env.example) solo los puertos y tu nombre de jugador.

services:
  minecraft:
    image: itzg/minecraft-server
    # apagado desde el panel (la marca .mcbot-apagado en su carpeta): espera sin
    # arrancar Minecraft hasta que se quita (Encender en el panel, o ./up.sh)
    entrypoint: ["/bin/sh", "-c", "while [ -e /data/.mcbot-apagado ]; do sleep 2; done; exec /image/scripts/start"]
    profiles: ["local"] # (COMPOSE_PROFILES=local en .env: sin él, solo el hub)
    ports: ["${MC_PORT:-25565}:25565"]
    environment:
      EULA: "TRUE"
      TYPE: VANILLA
      VERSION: "${MC_VERSION:-26.2}"
      ONLINE_MODE: "FALSE"
      ENFORCE_SECURE_PROFILE: "FALSE"
      DIFFICULTY: "${MC_DIFFICULTY:-easy}"
      MODE: survival
      VIEW_DISTANCE: 8
      SPAWN_PROTECTION: 0
      MEMORY: 2G
      MOTD: Cubit
      # (sin OPS: la imagen busca el nombre en las cuentas premium y, si no
      # existe, no arranca; el panel hace op a los dueños por RCON)
      # server.properties se crea con lo de arriba y luego se cambia desde el
      # panel (Servidor): no se vuelve a pisar en cada arranque
      OVERRIDE_SERVER_PROPERTIES: "false"
      RCON_PASSWORD: "${RCON_PASSWORD:-cubit}" # (la consola del servidor, para el panel; no sale de la red de Docker)
    volumes: ["./mc-data:/data"]
    restart: unless-stopped

  # la IA local (Ollama): los bots entienden frases normales ("mina 20 de hierro y
  # tráemelo"). Gratis y sin claves; los modelos van en un volumen propio.
  ollama:
    image: ollama/ollama:0.40.17
    volumes: [ollama-models:/root/.ollama]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # baja el modelo la primera vez (unos 4,6 GB) y se apaga; las veces siguientes
  # ya está en el volumen y termina al momento. Sin él, el bot también lo baja solo.
  ollama-pull:
    image: ollama/ollama:0.40.17
    depends_on:
      ollama: {condition: service_healthy}
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-gemma4:e2b-it-q4_K_M}"]
    restart: "no"

  # el hub: el panel siempre encendido y los bots (cada uno un proceso, en
  # bot-data/bots/<id>/); se crean, arrancan y paran desde el panel
  bot:
    build: .
    image: cubit
    depends_on:
      minecraft: {condition: service_started, required: false}
    ports: ["${PANEL_PORT:-8080}:8080"]
    volumes:
      - ./bot-data:/data
      - ./mc-data:/server # (la configuración del servidor local, para el panel)
    environment:
      MCBOT_RCON: "${RCON_ADDR:-minecraft:25575}" # (la consola del servidor local; con uno de fuera no hace nada)
      MCBOT_RCON_PASSWORD: "${RCON_PASSWORD:-cubit}"
      MCBOT_SERVER_DIR: /server
      MCBOT_TEST_SERVER: minecraft # (el servidor de pruebas, visto desde el bot)
      MCBOT_TEST_PORT: "${MC_PORT:-25565}" # (y desde tu equipo: para decirte cómo entrar)
      OLLAMA_URL: http://ollama:11434 # (la IA local; se apaga por bot en el panel)
      OLLAMA_MODEL: "${OLLAMA_MODEL:-gemma4:e2b-it-q4_K_M}"
    command:
      - --hub=:8080
      - --owner=${OWNER:-} # (el dueño que propone el asistente para un bot nuevo)
    restart: unless-stopped

volumes:
  ollama-models:
